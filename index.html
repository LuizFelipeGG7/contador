<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Nosso Contador de Amor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="particles" id="particles"></div>

    <div class="container">

        <header class="hero glass-card">
            <span class="hero-icon">💖</span>
            <div class="hero-badge">Desde 12 de Maio de 2025</div>
            <h1>Nosso Contador<br><span class="accent">de Amor</span></h1>
            <p class="hero-sub">Cada segundo ao seu lado é um presente</p>
        </header>

        <section class="glass-card counter-section">
            <p class="counter-label">Estamos juntos há</p>
            <div class="counter-grid">
                <div class="time-block">
                    <span class="time-value" id="daysTogether">0</span>
                    <span class="time-label">dias</span>
                </div>
                <div class="time-divider">:</div>
                <div class="time-block">
                    <span class="time-value" id="hoursTogether">0</span>
                    <span class="time-label">horas</span>
                </div>
                <div class="time-divider">:</div>
                <div class="time-block">
                    <span class="time-value" id="minutesTogether">0</span>
                    <span class="time-label">minutos</span>
                </div>
                <div class="time-divider">:</div>
                <div class="time-block">
                    <span class="time-value" id="secondsTogether">0</span>
                    <span class="time-label">segundos</span>
                </div>
            </div>
        </section>

        <section class="glass-card carousel-section">
            <h2 class="section-title">Nossas Memórias 📸</h2>
            <div class="carousel">
                <div class="carousel-inner" id="carouselInner"></div>
                <button class="carousel-btn prev" aria-label="Foto anterior">&#10094;</button>
                <button class="carousel-btn next" aria-label="Próxima foto">&#10095;</button>
                <div class="carousel-dots" id="carouselDots"></div>
            </div>
        </section>

        <section class="glass-card music-section">
            <h2 class="section-title">Nossa Música 🎵</h2>
            <iframe
                style="border-radius:16px; border:none"
                src="https://open.spotify.com/embed/track/2uP6t2J5MEwhr9rDkAAzwh?utm_source=generator&theme=0"
                width="100%"
                height="152"
                allowfullscreen
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy">
            </iframe>
        </section>

        <footer class="footer">
            Feito com <span class="footer-heart">❤️</span> para você
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
